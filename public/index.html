<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Ranker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>Photo Ranker</h1>
        <p class="subtitle">Upload up to 20 photos and battle for the podium.</p>
      </header>

      <section class="panel upload-panel">
        <div class="controls-row">
          <label for="photoInput" class="btn primary">Upload Photos</label>
          <input id="photoInput" type="file" accept="image/*" multiple hidden />
          <button id="startBtn" class="btn success" disabled>Start Ranking</button>
          <button id="resetBtn" class="btn ghost">Reset</button>
        </div>
        <p id="uploadMeta" class="meta">0 / 20 photos selected.</p>
        <div id="previewGrid" class="preview-grid"></div>
      </section>

      <section class="panel mode-panel">
        <h2>Battle Style</h2>
        <div class="mode-grid" id="modeGrid">
          <button class="mode-card active" data-mode="head-to-head">Head-to-Head</button>
          <button class="mode-card" data-mode="speed-blitz">Speed Blitz</button>
          <button class="mode-card" data-mode="vibe-check">Vibe Check</button>
          <button class="mode-card" data-mode="boxing-ring">Boxing Ring</button>
          <button class="mode-card" data-mode="slot-machine">Slot Machine</button>
          <button class="mode-card" data-mode="runway">Runway</button>
        </div>
      </section>

      <section class="panel arena" id="arena" hidden>
        <div class="arena-top">
          <div class="chip">Mode: <span id="modeLabel">Head-to-Head</span></div>
          <div class="chip" id="timerChip" hidden>⏱ <span id="timer">30</span>s</div>
          <div class="chip">Streak: <span id="streak">0</span></div>
          <div class="chip">Confidence: <span id="confidence">0%</span></div>
        </div>

        <div id="battleStage" class="battle-stage split">
          <article class="fighter" id="fighterA" tabindex="0">
            <img id="imgA" alt="Photo A" />
            <button class="btn pick" data-pick="A">Pick Left</button>
          </article>
          <article class="fighter" id="fighterB" tabindex="0">
            <img id="imgB" alt="Photo B" />
            <button class="btn pick" data-pick="B">Pick Right</button>
          </article>
        </div>

        <div class="arena-actions">
          <button id="skipBtn" class="btn ghost">Skip Pair</button>
          <button id="finishBtn" class="btn danger">Finish + Show Results</button>
        </div>
      </section>

      <section class="panel results" id="results" hidden>
        <h2>Results</h2>
        <div id="podium" class="podium"></div>
        <ol id="rankingList" class="ranking-list"></ol>
      </section>
    </div>

    <div id="toast" class="toast" hidden></div>

    <dialog id="lightbox" class="lightbox">
      <img id="lightboxImg" alt="Enlarged photo" />
      <form method="dialog"><button class="btn">Close</button></form>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
