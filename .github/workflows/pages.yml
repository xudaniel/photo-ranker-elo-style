name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static site
        run: |
          mkdir -p _site/vendor/inter _site/vendor/phosphor
          cp -R public/. _site/
          cp -R node_modules/@fontsource-variable/inter/. _site/vendor/inter/
          cp -R node_modules/@phosphor-icons/web/src/. _site/vendor/phosphor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
